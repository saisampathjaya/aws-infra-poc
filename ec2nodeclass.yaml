apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass

metadata:
  name: default

spec:
  amiFamily: AL2023

  role: dev-eks-karpenter-role

  amiSelectorTerms:
    - alias: al2023@latest

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: dev-eks

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: dev-eks